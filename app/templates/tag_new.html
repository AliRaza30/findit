{% extends "base.html" %}
{% block title %}Register Smart Tag · FindIt{% endblock %}

{% block content %}

<div class="row justify-content-center my-4">
  <div class="col-md-7 col-lg-6">
    <div class="mb-4">
      <a href="{{ url_for('tags.my_tags') }}" class="btn btn-glass btn-sm mb-3">
        <i class="fa fa-arrow-left me-1"></i>Back to My Tags
      </a>
      <h3 class="fw-800 text-white mb-1">Register a <span class="brand-gradient-text">Smart QR Tag</span></h3>
      <p class="text-secondary small">Generate a printable QR sticker label. Anyone who finds this item can scan it to alert you anonymously.</p>
    </div>

    <div class="glass-panel p-4">
      <form method="post">
        <div class="mb-3">
          <label class="form-label-custom">
            <i class="fa fa-cube text-primary"></i>Item Name / Description
          </label>
          <input type="text" name="item_name" class="form-control-custom w-100" placeholder="e.g. Space Grey MacBook Pro or Dorm Key Ring" required>
        </div>

        <div class="mb-3">
          <label class="form-label-custom">
            <i class="fa fa-tag text-info"></i>Category
          </label>
          <select name="category" class="form-select-custom w-100" required>
            <option value="Electronics">Electronics (Laptop, Phone, Headphones)</option>
            <option value="Keys">Keys &amp; Access Fobs</option>
            <option value="Wallet">Wallet &amp; Cardholder</option>
            <option value="Bags & Backpacks">Bags &amp; Backpacks</option>
            <option value="Documents & IDs">Documents &amp; Student IDs</option>
            <option value="Other">Other Personal Possessions</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label-custom">
            <i class="fa fa-gift text-warning"></i>Reward / Finder Gratitude Note (Optional)
          </label>
          <input type="text" name="reward_message" class="form-control-custom w-100" placeholder="e.g. $40 cash reward offered + free coffee!">
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" name="anonymous_contact" value="1" id="anonCheck" checked>
          <label class="form-check-label small text-secondary" for="anonCheck">
            Protect my identity: Allow finders to message me through FindIt without exposing my personal email or phone number.
          </label>
        </div>

        <button class="btn btn-glow-primary w-100 py-2">
          <i class="fa fa-qrcode me-2"></i>Generate Smart Tag
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
